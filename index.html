<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E3E8E1">
<meta name="description" content="Plan where every paycheck goes. Works offline.">
<title>Payday Waterfall</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preload" href="archivo.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Archivo";font-style:normal;font-display:swap;font-weight:100 900;font-stretch:62% 125%;src:url(archivo.woff2) format("woff2-variations"),url(archivo.woff2) format("woff2")}
html,body{margin:0;background:#E3E8E1;color:#173A31;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
#boot{font-family:Archivo,system-ui,sans-serif;padding:28px 16px;max-width:480px;margin:0 auto;font-weight:760}
</style>
<script>
  // Keep Chrome's install prompt so the app can offer an "Install app" button.
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    window.__pwInstall = e;
    window.dispatchEvent(new Event("pw-installable"));
  });
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("./sw.js"); });
  }
</script>
</head>
<body>
<div id="root"><div id="boot">Payday Waterfall</div></div>
<noscript>Turn on JavaScript to use Payday Waterfall.</noscript>
<script src="app.js"></script>
</body>
</html>
