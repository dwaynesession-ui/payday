.fe{--paper:#E3E8E1;--sheet:#F4F6F1;--white:#FFFFFF;--ink:#173A31;--ink2:#51675F;--rule:#C8D1C6;--graphite:#4A5753;--olive:#7E8C4F;--steel:#2F5F7A;--sienna:#A0522D;--teal:#2B7A78;--plum:#7A4E86;--ochre:#B07F1E;--green:#2E7A55;--alarm:#B3261E;--slate:#5B6B8C;--t:23,58,49;
font-family:"Archivo",ui-sans-serif,system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
.fe *{box-sizing:border-box}
.fe-wrap{max-width:480px;margin:0 auto;padding:14px 16px 104px}
.fe-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 2px 10px}
.fe-brand{font-weight:760;font-size:16px;letter-spacing:-.01em;font-variation-settings:"wdth" 120}
.fe-status{font-size:12px;color:var(--ink2)}
.fe-h1{font-size:30px;line-height:1.08;font-weight:720;letter-spacing:-.025em;font-variation-settings:"wdth" 112;margin:10px 0 8px;text-wrap:balance}
.fe-h2{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:0}
.fe-h3{font-size:14px;font-weight:720;letter-spacing:.02em;text-transform:uppercase;color:var(--ink2);margin:20px 0 0}
.fe-sub{color:var(--ink2);font-size:15px;margin:0;max-width:60ch}
.fe-small{font-size:13px;color:var(--ink2)}
.fe-sheet{background:var(--sheet);border-radius:20px;padding:16px;margin-top:14px}
.fe-sheet-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.fe-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 0;border-top:1px solid var(--rule)}
.fe-row:first-child{border-top:0}
.fe-num{font-weight:660;font-variation-settings:"wdth" 106;white-space:nowrap}
.fe-big{font-size:44px;line-height:1;font-weight:740;letter-spacing:-.035em;font-variation-settings:"wdth" 118}
.fe-btn{appearance:none;border:0;border-radius:12px;padding:15px 16px;font:inherit;font-weight:680;cursor:pointer;width:100%;background:var(--ink);color:var(--sheet);display:flex;align-items:center;justify-content:center;gap:8px}
.fe-btn:disabled{opacity:.35;cursor:not-allowed}
.fe-btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.fe-btn.danger{background:var(--alarm)}
.fe-link{appearance:none;border:0;background:none;font:inherit;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px 0;font-weight:600}
.fe :focus-visible{outline:2.5px solid var(--steel);outline-offset:2px}
.fe-field{display:flex;align-items:center;gap:4px;background:var(--white);border:1.5px solid var(--rule);border-radius:10px;padding:0 10px;min-height:44px;flex:1;min-width:0}
.fe-field input,.fe-field select{border:0;outline:0;background:transparent;font:inherit;color:var(--ink);width:100%;min-width:0;padding:10px 0}
.fe-field:focus-within{border-color:var(--ink)}
.fe-field .affix{color:var(--ink2);white-space:nowrap}
.fe-field.hero{min-height:72px;border-radius:16px;padding:0 16px}
.fe-field.hero input{font-size:38px;font-weight:720;letter-spacing:-.03em;font-variation-settings:"wdth" 116}
.fe-field.hero .affix{font-size:30px}
.fe-label{font-size:12.5px;color:var(--ink2);display:block;margin-bottom:4px}
.fe-nav{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--rule);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20}
.fe-nav-inner{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.fe-tab{appearance:none;border:0;background:none;font:inherit;font-size:12px;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;border-radius:10px}
.fe-tab[aria-current="page"]{color:var(--ink);font-weight:720}
.fe-wf{display:grid;gap:12px;margin-top:6px}
.fe-wf-label{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;margin-bottom:5px}
.fe-lvl{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;background:rgba(var(--t),.1);font-size:11px;font-weight:700;margin-right:6px;vertical-align:1px}
.fe-track{position:relative;height:16px;background:rgba(var(--t),.07);border-radius:3px}
.fe-seg{position:absolute;top:0;bottom:0;border-radius:2px;transition:left .7s cubic-bezier(.2,.7,.2,1),width .7s cubic-bezier(.2,.7,.2,1)}
.fe-guide{position:absolute;top:-4px;bottom:-4px;width:0;border-left:1px dashed rgba(var(--t),.4)}
.fe-hatch{background:repeating-linear-gradient(135deg,var(--alarm) 0 3px,transparent 3px 7px);box-shadow:inset 0 0 0 1.5px var(--alarm)}
.fe-legend{display:grid;gap:0;margin-top:4px}
.fe-legend div{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--rule);font-size:14px}
.fe-dot{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.fe-phases{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.fe-ptrack{height:6px;background:rgba(var(--t),.13);border-radius:3px}
.fe-ptrack div{height:100%;background:var(--ink);border-radius:3px}
.fe-pn{font-size:12px;color:var(--ink2);margin-top:8px}
.fe-pname{font-size:13.5px;line-height:1.25;color:var(--ink2)}
.fe-pname.on{color:var(--ink);font-weight:720}
.fe-steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:4px}
.fe-steps div{height:4px;border-radius:2px;background:rgba(var(--t),.13)}
.fe-steps div.on{background:var(--ink)}
.fe-order{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--rule)}
.fe-order:first-child{border-top:0}
.fe-check{appearance:none;width:28px;height:28px;border-radius:8px;border:1.5px solid var(--ink);display:grid;place-items:center;flex:none;background:var(--white);color:var(--sheet);cursor:pointer;padding:0}
.fe-check[aria-checked="true"]{background:var(--ink)}
.fe-pill{display:inline-block;font-size:12px;font-weight:650;padding:2px 8px;border-radius:999px;background:rgba(var(--t),.1)}
.fe-pill.warn{background:rgba(179,38,30,.1);color:var(--alarm)}
.fe-pill.ok{background:rgba(46,122,85,.12);color:var(--green)}
.fe-alert{background:rgba(179,38,30,.08);border-left:3px solid var(--alarm);padding:11px 12px;border-radius:4px 12px 12px 4px;font-size:14px;margin-top:12px}
.fe-note{background:rgba(47,95,122,.09);border-left:3px solid var(--steel);padding:11px 12px;border-radius:4px 12px 12px 4px;font-size:14px;margin-top:12px}
.fe-good{background:rgba(46,122,85,.1);border-left:3px solid var(--green);padding:11px 12px;border-radius:4px 12px 12px 4px;font-size:14px;margin-top:12px}
.fe-scrim{position:fixed;inset:0;background:rgba(15,34,29,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.fe-panel{background:var(--sheet);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.fe-segctl{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:rgba(var(--t),.08);border-radius:11px;padding:3px;gap:3px}
.fe-segctl button{appearance:none;border:0;background:transparent;font:inherit;font-size:14px;padding:9px 4px;border-radius:8px;cursor:pointer;color:var(--ink2)}
.fe-segctl button[aria-pressed="true"]{background:var(--white);color:var(--ink);font-weight:680}
.fe-segctl.small button{font-size:13px;padding:8px 2px}
.fe-item{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--rule)}
.fe-item:first-of-type{border-top:0}
.fe-line{display:flex;gap:8px;align-items:center}
.fe-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fe-grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.fe-icon{appearance:none;border:0;background:transparent;color:var(--ink2);width:40px;height:40px;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:none}
.fe-add{appearance:none;border:1.5px dashed var(--rule);background:transparent;color:var(--ink);font:inherit;font-weight:620;border-radius:10px;padding:11px;width:100%;display:flex;gap:6px;align-items:center;justify-content:center;cursor:pointer;margin-top:8px}
.fe-acct-head{appearance:none;border:0;background:transparent;font:inherit;color:inherit;display:flex;align-items:center;gap:12px;width:100%;padding:14px 0;cursor:pointer;text-align:left}
.fe-acct{border-top:1px solid var(--rule)}
.fe-acct:first-child{border-top:0}
.fe-acct-body{padding:0 0 16px 22px}
.fe-bar{height:5px;background:rgba(var(--t),.12);border-radius:3px;overflow:hidden;margin-top:6px}
.fe-bar div{height:100%;border-radius:3px}
.fe-check-row{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.fe-check-row input{width:18px;height:18px;accent-color:var(--ink)}
.fe-ev{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;padding:10px 0;border-top:1px solid var(--rule);font-size:14px}
.fe-ev:first-child{border-top:0}
.fe-ev .d{color:var(--ink2);font-size:12.5px;min-width:52px}
.fe-ev .b{font-size:12.5px;color:var(--ink2);text-align:right}
.fe-ev.pay .n{color:var(--green)}
.fe-ev.bad .b{color:var(--alarm);font-weight:680}
.fe-hitem{border-left:3px solid var(--rule);padding:10px 0 10px 12px;border-top:1px solid var(--rule)}
.fe-hitem:first-of-type{border-top:0}
.fe-goal{padding:12px 0;border-top:1px solid var(--rule)}
.fe-goal:first-of-type{border-top:0}
.fe-whatif{margin-top:14px;padding:12px;border-radius:12px;background:rgba(var(--t),.05)}
.fe-range{width:100%;accent-color:var(--ink);margin:8px 0 0;height:28px}
.fe-stepper{display:inline-flex;align-items:center;gap:12px}
.fe-stepper button{appearance:none;width:34px;height:34px;border-radius:10px;border:1.5px solid var(--ink);background:var(--white);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.fe-stepper button:disabled{opacity:.3;cursor:not-allowed}
.fe-tab{position:relative}
.fe-badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--alarm);color:var(--sheet);font-size:10.5px;font-weight:720;display:grid;place-items:center;line-height:1}
.fe-choice{appearance:none;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);font:inherit;text-align:left;border-radius:16px;padding:16px;cursor:pointer;width:100%}
.fe-choice:hover{border-color:var(--ink)}
.fe-tour{position:fixed;inset:0;background:var(--paper);z-index:60;overflow-y:auto;-webkit-overflow-scrolling:touch}
.fe-tour-foot{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--rule);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:61}
.fe-tour-foot-inner{max-width:480px;margin:0 auto;display:flex;gap:12px;align-items:center}
.fe-term{padding:11px 0;border-top:1px solid var(--rule)}
.fe-term:first-child{border-top:0}
.fe-term b{display:block;font-weight:700;margin-bottom:2px}
.fe-term p{margin:0;font-size:14px;color:var(--ink2);line-height:1.45}
.fe-ol{margin:0;padding-left:22px;display:grid;gap:9px;font-size:14.5px}
.fe-ol li{padding-left:2px}
.fe-ol li::marker{font-weight:700;color:var(--ink)}
.fe-where{display:inline-block;font-size:12px;font-weight:650;background:rgba(var(--t),.08);padding:1px 7px;border-radius:6px;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.fe-seg{transition:none}}

.fe[data-theme="dark"]{--paper:#0F1715;--sheet:#172320;--white:#1E2B28;--ink:#E4EDE8;--ink2:#9DB3AA;--rule:#2D3D39;--graphite:#93A59F;--olive:#A9B872;--steel:#76AED0;--sienna:#DE9166;--teal:#63BDB9;--plum:#BC92C9;--ochre:#E2B85E;--green:#62C492;--alarm:#F2837A;--slate:#A3B0D0;--t:228,237,232;color-scheme:dark}

.fe-quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.fe-quick button{appearance:none;border:0;background:var(--sheet);color:var(--ink);font:inherit;font-size:12.5px;font-weight:640;border-radius:14px;padding:11px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}
